[package]
name = "waybar-net-daemon"
version = "0.1.0"
edition = "2024"
description = "Single long-running daemon that fetches status endpoints and serves them to waybar clients over a unix socket."

[dependencies]
http = "1"
ureq = { version = "2", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
